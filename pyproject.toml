[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyfederation"
version = "0.1.0"
description = "Python client for Open Federated Database (OFD) servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Specification = "https://github.com/nosial/OFD-Specification"

[dependency-groups]
dev = [
    "anyio>=4",
    "mypy>=1.10",
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyfederation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "RET", "G", "LOG", "PT", "PTH", "FLY",
    "FURB", "RSE", "ERA", "ISC", "T20", "DTZ", "PLE", "PLW", "PLC", "ICN", "YTT", "SLOT",
]

[tool.ruff.lint.per-file-ignores]
# Command-line entry points report to the terminal.
"scripts/unasync.py" = ["T20"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
